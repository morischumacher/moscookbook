name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch cancels the first — no point finishing a run
# for code that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # A throwaway Postgres, so the migrations and the German search are checked
    # against the real thing rather than against an assumption about it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs `prisma generate`, which needs no database.
      - run: npm ci

      # Cheapest checks first, so an obvious mistake fails in seconds.
      - name: Translations
        run: npm run check:messages

      - name: Recipe writers maintain the search columns
        run: npm run check:search

      - name: Colour contrast
        run: npm run check:contrast

      - name: Colours stay inside the design tokens
        run: npm run check:design

      - name: Colour classes survive the build
        run: npm run check:tokens

      - name: The oyster is actually in the icons
        run: npm run check:icons

      - name: The blob sweep knows every picture column
        run: npm run check:blobs

      - name: The AI keys are read in one place
        run: npm run check:secrets

      - name: Backup coverage
        run: npm run check:backup

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Migrations apply to an empty database
        env:
          POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/migrations
          POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/migrations
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE migrations'
          npx prisma migrate deploy

      - name: German search against a real Postgres
        env:
          VERIFY_SEARCH_URL: postgresql://postgres:postgres@localhost:5432/migrations
        run: npm run verify:search

      - name: Build
        # Placeholder values: nothing here connects to a database or serves a
        # request, but Prisma refuses to construct a client without a URL and
        # the session helper refuses to run in production without a secret.
        env:
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
          SECRET_COOKIE_PASSWORD: ci-placeholder-secret-at-least-32-characters
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build
